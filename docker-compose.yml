services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    # Set DOCKER_HUB_IMAGE in .env (e.g. yourdockeruser/rm-main-be:1.0.0) so `docker compose build` tags
    # the image for `docker compose push api`. Default is a local-only tag.
    image: ${DOCKER_HUB_IMAGE:-rm-main-be:local}
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-app}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
